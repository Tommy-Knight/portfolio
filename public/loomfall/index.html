      /* Colour: watercolour dabs, the chosen one circled in red ink. */
      .creator-dabs {
        display: flex;
        justify-content: center;
        gap: 3px;
        min-width: 0;
        padding: 4px 0;
      }
      .creator-dab {
        position: relative;
        flex: 1 1 0;
        min-width: 0;
        max-width: 40px;
        aspect-ratio: 64 / 52;
        padding: 0;
        border: 0;
        background: none;
        cursor: pointer;
      }
      .creator-dab canvas {
        display: block;
        width: 100%;
        height: 100%;
        transition: transform 0.15s ease;
      }
      .creator-dab:hover canvas {
        transform: scale(1.1) rotate(-3deg);
      }
      .creator-ring {
        position: absolute;
        left: -18%;
        top: -22%;
        width: 136%;
        height: 144%;
        overflow: visible;
        pointer-events: none;
        fill: none;
        stroke: var(--red-ink);
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        opacity: 0;
        transition: stroke-dashoffset 0.35s ease-out, opacity 0.12s linear;
      }
      .creator-dab.chosen .creator-ring {
        stroke-dashoffset: 0;
        opacity: 1;
      }

      /* Foot: chance, and the seal. */
      .creator-actions {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid var(--ink-faint);
      }
      .creator-chance {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 8px 4px;
        border: 0;
        background: none;
        font: italic 17px var(--serif);
        color: var(--ink);
        cursor: pointer;
        white-space: nowrap;
      }
      .creator-die {
        width: 22px;
        height: 22px;
        fill: none;
        stroke: var(--ink);
        stroke-width: 1.3;
        transition: transform 0.3s cubic-bezier(0.3, 1.6, 0.5, 1);
      }
      .creator-die circle {
        fill: var(--ink);
        stroke: none;
      }
      .creator-chance:hover {
        color: var(--red-ink);
      }
      .creator-chance:hover .creator-die {
        transform: rotate(-24deg);
        stroke: var(--red-ink);
      }
      .creator-chance:hover .creator-die circle {
        fill: var(--red-ink);
      }
      .creator-chance:active .creator-die {
        transform: rotate(160deg) scale(0.9);
      }

      /* The seal: a banner cut like the chart's cartouche, in sealing wax,
         with a pale hairline inside its edge. Three layers of the same shape:
         the dark rim, the hairline, the wax. */
      .creator-seal {
        --notch: 16px;
        position: relative;
        flex: 0 1 216px;
        min-width: 176px;
        height: 50px;
        padding: 0;
        border: 0;
        background: #4e0f0a;
        clip-path: polygon(var(--notch) 0, calc(100% - var(--notch)) 0, 100% 50%, calc(100% - var(--notch)) 100%, var(--notch) 100%, 0 50%);
        cursor: pointer;
        transition: filter 0.2s ease, transform 0.1s ease;
      }
      .creator-seal::before,
      .creator-seal::after {
        content: '';
        position: absolute;
        clip-path: polygon(var(--notch) 0, calc(100% - var(--notch)) 0, 100% 50%, calc(100% - var(--notch)) 100%, var(--notch) 100%, 0 50%);
      }
      .creator-seal::before {
        inset: 3px;
        --notch: 14.5px;
        background: rgba(246, 226, 190, 0.55);
      }
      .creator-seal::after {
        inset: 4px;
        --notch: 14px;
        background:
          radial-gradient(120% 160% at 28% 12%, rgba(255, 190, 160, 0.35), transparent 45%),
          radial-gradient(140% 120% at 70% 110%, rgba(40, 0, 0, 0.45), transparent 60%),
          linear-gradient(#b73a2c, #8d2219);
      }
      .creator-seal-text {
        position: relative;
        z-index: 1;
        font: 20px/50px var(--serif-sc);
        letter-spacing: 0.08em;
        color: #f6e6c8;
        text-shadow: 0 1px 0 rgba(60, 8, 4, 0.8), 0 -1px 0 rgba(255, 210, 180, 0.25);
      }
      .creator-seal:hover {
        filter: brightness(1.12) saturate(1.05);
      }
      .creator-seal:active {
        transform: translateY(1px);
        filter: brightness(0.95);
      }
      .creator-seal[aria-disabled='true'] {
        filter: saturate(0.35) brightness(0.92);
        cursor: default;
      }
      .creator-need {
        display: none;
        flex: 0 0 auto;
        margin-top: 4px;
        text-align: right;
        padding-right: 30px;
        font-style: italic;
        font-size: 13px;
        color: var(--red-ink);
        opacity: 0.85;
      }
      .creator-card.unnamed .creator-need {
        display: block;
      }
      .creator button:focus-visible {
        outline: 2px solid var(--red-ink);
        outline-offset: 2px;
      }
      .creator-seal:focus-visible {
        outline: none;
        filter: brightness(1.15);
      }

      /* The turn hint, under the character. */
      .creator-hint {
        position: absolute;
        transform: translate(-50%, 0);
        display: flex;
        flex-direction: column;
        align-items: center;
        font-style: italic;
        font-size: 15px;
        color: rgba(59, 43, 29, 0.72);
        text-shadow: 0 0 6px rgba(240, 226, 194, 0.9);
        animation: creator-hint-in 1s 0.8s ease both;
      }
      @keyframes creator-hint-in {
        from {
          opacity: 0;
        }
      }
      .creator-turn {
        width: 150px;
        height: 28px;
        margin-bottom: -10px;
        fill: none;
        stroke: rgba(59, 43, 29, 0.6);
        stroke-width: 1.3;
        stroke-linecap: round;
      }

      /* Short window: the head tightens so more of the ledger shows. */
      @media (min-width: 701px) and (max-height: 700px) {
        .creator-card {
          padding-top: 24px;
        }
        .creator-name {
          font-size: 30px;
        }
        .creator-under {
          display: none;
        }
      }

      /* Phone: a bottom sheet. The character stands in the clear top. */
      @keyframes creator-sheet-in {
        from {
          opacity: 0;
          transform: translateY(40px);
        }
      }
      @media (max-width: 700px) {
        .creator-card {
          left: 0;
          right: 0;
          top: auto;
          bottom: 0;
          width: auto;
          max-height: 60dvh;
          transform: none;
          padding: 24px max(24px, env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
          animation-name: creator-sheet-in;
        }
        .creator-over {
          font-size: 13px;
        }
        .creator-name {
          font-size: 28px;
        }
        .creator-name::placeholder {
          font-size: 24px;
        }
        .creator-flourish {
          width: 150px;
          margin: 3px auto 0;
        }
        .creator-under {
          display: none;
        }
        .creator-row {
          grid-template-columns: 76px minmax(0, 1fr);
        }
        /* Too narrow to share a line with its label. */
        .creator-row.inline .creator-dabs {
          grid-column: 1 / -1;
        }
        .creator-step {
          width: 40px;
          height: 36px;
        }
        .creator-seal {
          min-width: 160px;
          height: 46px;
        }
        .creator-seal-text {
          font-size: 18px;
          line-height: 46px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .creator,
        .creator * {
          animation: none !important;
          transition: none !important;
        }
      }

      /* The veil (ui/veil.ts): the creator's painted sky, up from the first
         paint so no half-built scene is ever shown. The gradient is only
         what shows before the script paints the canvas. Under the dev panel
         and the error HUD, over everything else. */
      .veil {
        position: fixed;
        inset: 0;
        z-index: 20;
        overflow: hidden;
        background: linear-gradient(#96b4be, #c9cfc0 55%, #e6d2a8);
        transition-property: opacity;
        transition-timing-function: cubic-bezier(0.45, 0, 0.2, 1);
      }
      .veil canvas {
        display: block;
        width: 100%;
        height: 100%;
        transform-origin: 50% 35%;
        transition-property: transform;
        transition-timing-function: cubic-bezier(0.2, 0.6, 0.3, 1);
      }
      .veil.lifted {
        opacity: 0;
        pointer-events: none;
      }
      /* A boss's health across the top (ui/bossBar.ts). */
      #bossBar {
        position: fixed;
        top: max(12px, env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        width: min(440px, calc(100vw - 48px));
        padding: 6px 12px 8px;
        box-sizing: border-box;
        background: rgba(10, 9, 14, 0.78);
        border: 2px solid #a8833a;
        border-radius: 6px;
        color: #efe2c2;
        text-align: center;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-weight: 700;
        font-size: 14px;
        text-shadow: 0 1px 0 #000;
        z-index: 8;
        pointer-events: none;
        transition: opacity 0.5s;
      }
      #bossBar.hidden {
        opacity: 0;
      }
      #bossBar .track {
        height: 10px;
        margin-top: 5px;
        background: #26191b;
        border: 1px solid #5a3a3a;
        border-radius: 3px;
        overflow: hidden;
      }
      #bossBar .fill {
        height: 100%;
        width: 100%;
        background: linear-gradient(#e8604e, #8a1f1f);
        transition: width 0.25s;
      }
      /* Through a dungeon door: the dark, not the sky. */
      .veil.dark {
        background: #06070a;
      }
      .veil.dark canvas {
        visibility: hidden;
      }
      /* Swells as it goes: the camera is coming down through it. */
      .veil.lifted canvas {
        transform: scale(1.1);
      }
      #hud.error {
        z-index: 25;
      }

      /* The interface is away while the player arrives (game/arrival.ts):
         everything the game adds to the body, minus the canvas, the veil,
         the HUD and the dev tools. It eases back only when coming back. */
      body.ui-away > :not(#app):not(#hud):not(script):not(.veil):not(.dev-panel) {
        opacity: 0;
        pointer-events: none;
      }
      body.ui-easing > :not(#app):not(#hud):not(script):not(.veil):not(.dev-panel) {
        transition: opacity 0.9s ease-out !important;
      }
    </style>
    <script type="module" crossorigin src="/loomfall/assets/index-DKpUWLo9.js"></script>
  </head>
  <body>
    <div id="app"><canvas id="renderCanvas" touch-action="none"></canvas></div>
    <div id="veil" class="veil"><canvas></canvas></div>
